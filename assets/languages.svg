<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200" role="img" aria-labelledby="t">
<title id="t">Most used languages, public and private repositories</title>
<style>
.title{font:600 18px 'Segoe UI',Ubuntu,'Helvetica Neue',sans-serif;fill:#61dafb}
.sub{font:400 12px 'Segoe UI',Ubuntu,sans-serif;fill:#8b949e}
.lang{font:400 12.5px 'Segoe UI',Ubuntu,sans-serif;fill:#e6edf3}
.pct{fill:#8b949e}
.item{opacity:0;animation:fade .4s ease-in-out forwards}
@keyframes fade{to{opacity:1}}
</style>
<rect x="0.5" y="0.5" rx="6" width="419" height="199" fill="#0d1117"/>
<text x="25" y="32" class="title">Most Used Languages</text>
<text x="25" y="50" class="sub">Public and private repositories, third-party code excluded</text>
<clipPath id="r"><rect x="25" y="62" width="370" height="10" rx="5"/></clipPath>
<g clip-path="url(#r)"><rect x="25.00" y="62" width="86.46" height="10" fill="#f1e05a"/><rect x="111.46" y="62" width="82.75" height="10" fill="#2ea44f"/><rect x="194.21" y="62" width="69.52" height="10" fill="#3572A5"/><rect x="263.73" y="62" width="48.15" height="10" fill="#7cc4ff"/><rect x="311.88" y="62" width="47.78" height="10" fill="#e34c26"/><rect x="359.66" y="62" width="14.65" height="10" fill="#8f6ad8"/><rect x="374.31" y="62" width="9.95" height="10" fill="#f34b7d"/><rect x="384.25" y="62" width="4.03" height="10" fill="#5391fe"/><rect x="388.28" y="62" width="6.72" height="10" fill="#8b949e"/></g>
<g transform="translate(25,100)" class="item" style="animation-delay:150ms"><circle cx="5" cy="-4" r="5" fill="#f1e05a"/><text x="16" y="0" class="lang">JavaScript <tspan class="pct">23.4%</tspan></text></g><g transform="translate(215,100)" class="item" style="animation-delay:230ms"><circle cx="5" cy="-4" r="5" fill="#2ea44f"/><text x="16" y="0" class="lang">C# <tspan class="pct">22.4%</tspan></text></g><g transform="translate(25,122)" class="item" style="animation-delay:310ms"><circle cx="5" cy="-4" r="5" fill="#3572A5"/><text x="16" y="0" class="lang">Python <tspan class="pct">18.8%</tspan></text></g><g transform="translate(215,122)" class="item" style="animation-delay:390ms"><circle cx="5" cy="-4" r="5" fill="#7cc4ff"/><text x="16" y="0" class="lang">TypeScript <tspan class="pct">13.0%</tspan></text></g><g transform="translate(25,144)" class="item" style="animation-delay:470ms"><circle cx="5" cy="-4" r="5" fill="#e34c26"/><text x="16" y="0" class="lang">HTML <tspan class="pct">12.9%</tspan></text></g><g transform="translate(215,144)" class="item" style="animation-delay:550ms"><circle cx="5" cy="-4" r="5" fill="#8f6ad8"/><text x="16" y="0" class="lang">CSS <tspan class="pct">4.0%</tspan></text></g><g transform="translate(25,166)" class="item" style="animation-delay:630ms"><circle cx="5" cy="-4" r="5" fill="#f34b7d"/><text x="16" y="0" class="lang">C++ <tspan class="pct">2.7%</tspan></text></g><g transform="translate(215,166)" class="item" style="animation-delay:710ms"><circle cx="5" cy="-4" r="5" fill="#5391fe"/><text x="16" y="0" class="lang">PowerShell <tspan class="pct">1.1%</tspan></text></g><g transform="translate(25,188)" class="item" style="animation-delay:790ms"><circle cx="5" cy="-4" r="5" fill="#8b949e"/><text x="16" y="0" class="lang">Other <tspan class="pct">1.8%</tspan></text></g>
</svg>
